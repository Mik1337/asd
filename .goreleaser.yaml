# goreleaser config — https://goreleaser.com
# Cuts cross-platform binaries on a git tag and updates a Homebrew tap.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   goreleaser release --clean        (needs GITHUB_TOKEN)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: asd
    main: .
    binary: asd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: asd
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Mik1337
    name: asd

# Updates the cask in Mik1337/homebrew-tap so users can:
#   brew install Mik1337/tap/asd   then   brew upgrade asd
# Requires a separate repo named "homebrew-tap" and a token with access.
# Casks are macOS-only; Linux users install via `go install` or the tarballs.
homebrew_casks:
  - name: asd
    repository:
      owner: Mik1337
      name: homebrew-tap
      # PAT with write access to the tap repo. Locally, export TAP_GITHUB_TOKEN;
      # in CI it comes from a repo secret (see .github/workflows/release.yml).
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Mik1337/asd"
    description: "Translate a natural-language description into a shell command"
    license: "MIT"
    # Strip the quarantine flag so the unsigned binary runs without a Gatekeeper
    # prompt on first launch.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/asd"]
          end
